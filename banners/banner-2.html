<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:628px;overflow:hidden;font-family:'Inter',sans-serif}
.banner{position:relative;width:1200px;height:628px;background:#001233;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 500px at 85% -10%,rgba(0,110,255,.28),transparent 60%),
  radial-gradient(700px 420px at -10% 110%,rgba(111,168,255,.18),transparent 60%)}
.copy{position:relative;z-index:2;height:100%;padding:60px 70px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.brand{font-weight:600;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.95)}
.brand .life{color:#7EC8FF;font-weight:800}
.byline{font-size:12.5px;color:rgba(255,255,255,.7);margin:6px 0 30px;letter-spacing:.04em}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:56px;line-height:1.08;color:#fff;max-width:920px;margin-bottom:18px}
h1 em{font-style:italic;color:#6FA8FF}
.sub{font-size:19px;line-height:1.5;color:rgba(255,255,255,.85);max-width:760px;margin-bottom:30px}
.sub strong{color:#fff}
.strip-label{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#8FB9F0;margin-bottom:16px}
.logos{display:flex;align-items:center;gap:38px;margin-bottom:34px}
.logos img{height:30px;width:auto;filter:brightness(0) invert(1);opacity:.92}
.logos .ap-chip{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;padding:7px 12px}
.logos .ap-chip img{height:30px;filter:none;opacity:1}
.cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,#5EB6FF 0%,#2E8BE6 100%);color:#06243F;font-weight:800;font-size:19px;padding:17px 34px;border-radius:14px;box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 10px 26px rgba(46,139,230,.38)}
</style>
</head>
<body>
<div class="banner">
  <div class="copy">
    <div class="brand">Longevity <span class="life">Life</span> Academy</div>
    <div class="byline">by eTeacher Group</div>
    <h1>The course making <em>national headlines</em> — now your friends can join it.</h1>
    <p class="sub">Refer a friend to The Longevity Blueprint and earn <strong>$300</strong> when they enroll. Internal referral program for all eTeacher Group employees.</p>
    <div class="strip-label">As Seen On</div>
    <div class="logos">
      <span class="ap-chip"><img src="../assets/logos/ap.svg" alt="AP News"></span>
      <img src="../assets/logos/yahoo-finance.svg" alt="Yahoo Finance">
      <img src="../assets/logos/usatoday.svg" alt="USA Today">
    </div>
    <span class="cta">Refer a Friend · Earn $300 →</span>
  </div>
</div>
</body>
</html>
