<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:628px;overflow:hidden;font-family:'Inter',sans-serif}
.banner{position:relative;width:1200px;height:628px;background:#001233;overflow:hidden;display:flex}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,18,51,.96) 0%,rgba(0,18,51,.84) 46%,rgba(0,18,51,.30) 100%)}
.copy{position:relative;z-index:2;padding:64px 60px;display:flex;flex-direction:column;justify-content:center;max-width:720px}
.brand{font-weight:600;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.95);margin-bottom:6px}
.brand .life{color:#7EC8FF;font-weight:800}
.byline{font-size:12.5px;color:rgba(255,255,255,.7);margin-bottom:36px;letter-spacing:.04em}
.tag{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#6FA8FF;margin-bottom:24px;padding:9px 18px;border:1px solid rgba(111,168,255,.4);border-radius:999px;background:rgba(111,168,255,.08);width:max-content}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#5EB6FF;box-shadow:0 0 8px #5EB6FF,0 0 14px rgba(94,182,255,.7)}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:64px;line-height:1.04;color:#fff;margin-bottom:20px}
h1 em{font-style:italic;color:#6FA8FF}
.sub{font-size:19px;line-height:1.5;color:rgba(255,255,255,.85);max-width:560px;margin-bottom:32px}
.sub strong{color:#fff}
.cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,#5EB6FF 0%,#2E8BE6 100%);color:#06243F;font-weight:800;font-size:19px;padding:17px 34px;border-radius:14px;width:max-content;box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 10px 26px rgba(46,139,230,.38)}
</style>
</head>
<body>
<div class="banner">
  <img class="bg" src="../assets/hero-referral.jpg" alt="">
  <div class="overlay"></div>
  <div class="copy">
    <div class="brand">Longevity <span class="life">Life</span> Academy</div>
    <div class="byline">by eTeacher Group</div>
    <div class="tag">Employee Referral Program</div>
    <h1>Refer a friend.<br><em>Earn $300.</em></h1>
    <p class="sub">Know someone who'd love our live 18-week longevity course, <strong>The Longevity Blueprint</strong>? Refer them — when they enroll, you get <strong>$300</strong>.</p>
    <span class="cta">Submit Your Referral →</span>
  </div>
</div>
</body>
</html>
