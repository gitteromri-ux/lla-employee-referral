<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:628px;overflow:hidden;font-family:'Inter',sans-serif}
.banner{position:relative;width:1200px;height:628px;background:#F7F4EC;overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr}
.copy{position:relative;z-index:2;padding:64px 30px 64px 60px;display:flex;flex-direction:column;justify-content:center}
.brand{font-weight:600;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:#001233}
.brand .life{color:#006EFF;font-weight:800}
.byline{font-size:12.5px;color:#5A6472;margin:6px 0 32px;letter-spacing:.04em}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:58px;line-height:1.06;color:#001233;margin-bottom:20px}
h1 em{font-style:italic;color:#006EFF}
.sub{font-size:19px;line-height:1.55;color:#2A2F36;max-width:520px;margin-bottom:30px}
.sub strong{color:#001233}
.cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,#5EB6FF 0%,#2E8BE6 100%);color:#06243F;font-weight:800;font-size:19px;padding:17px 34px;border-radius:14px;width:max-content;box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 10px 26px rgba(46,139,230,.30)}
.photo{position:relative;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#F7F4EC 0%,rgba(247,244,236,0) 22%)}
.chip{position:absolute;left:60px;top:56px;z-index:3;display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#0051CC;padding:9px 18px;border:1px solid rgba(0,110,255,.35);border-radius:999px;background:rgba(0,110,255,.07)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:#006EFF;box-shadow:0 0 8px rgba(0,110,255,.8)}
</style>
</head>
<body>
<div class="banner">
  <span class="chip">Employee Referral · $300 Reward</span>
  <div class="copy">
    <div class="brand">Longevity <span class="life">Life</span> Academy</div>
    <div class="byline">by eTeacher Group</div>
    <h1>Help someone you love <em>live longer.</em></h1>
    <p class="sub">Refer them to <strong>The Longevity Blueprint</strong> — 18 weeks, live classes, a personal longevity protocol. When they enroll, you earn <strong>$300</strong>.</p>
    <span class="cta">Submit Your Referral →</span>
  </div>
  <div class="photo"><img src="../assets/julie-goldenhour.jpg" alt=""></div>
</div>
</body>
</html>
